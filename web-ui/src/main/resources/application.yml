server:
  port: 8090

spring:
  application:
    name: web-ui
  thymeleaf:
    cache: false
  session:
    timeout: 30m
  codec:
    max-in-memory-size: 4MB

hms:
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.hms.webui: INFO
