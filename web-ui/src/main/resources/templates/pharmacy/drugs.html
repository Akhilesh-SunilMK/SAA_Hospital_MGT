<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Drug catalogue')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Drug catalogue</h2>
        <div>
            <a th:if="${currentUser.pharmacist or currentUser.admin}" class="btn btn-outline-secondary" th:href="@{/pharmacy/stock/low}">Low stock</a>
            <a th:if="${currentUser.pharmacist or currentUser.admin}" class="btn btn-primary" th:href="@{/pharmacy/drugs/new}"><i class="bi bi-plus-lg"></i> Add drug</a>
        </div>
    </div>

    <form method="get" th:action="@{/pharmacy/drugs}" class="row g-2 mb-3">
        <div class="col-auto flex-grow-1"><input class="form-control" name="search" th:value="${search}" placeholder="Search drugs"/></div>
        <div class="col-auto"><button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Search</button></div>
    </form>

    <div class="card">
        <table class="table table-hover mb-0 align-middle">
            <thead><tr><th>Code</th><th>Name</th><th>Form</th><th>Strength</th><th>Unit price</th><th>Reorder level</th><th th:if="${currentUser.pharmacist}">Adjust stock</th></tr></thead>
            <tbody>
            <tr th:each="d : ${results.content}">
                <td th:text="${d.code}"></td>
                <td th:text="${d.genericName} + (${d.brandName} != null ? ' (' + ${d.brandName} + ')' : '')"></td>
                <td th:text="${d.form}"></td>
                <td th:text="${d.strength}"></td>
                <td th:text="${d.unitPrice}"></td>
                <td th:text="${d.reorderLevel}"></td>
                <td th:if="${currentUser.pharmacist}">
                    <form method="post" th:action="@{/pharmacy/stock/{id}/adjust(id=${d.id})}" class="d-flex gap-1">
                        <input class="form-control form-control-sm" style="width:6.5rem" name="batchNo" placeholder="Batch" required/>
                        <input class="form-control form-control-sm" style="width:5rem" type="number" name="quantity" placeholder="Qty" required/>
                        <input class="form-control form-control-sm" style="width:9rem" type="date" name="expiryDate" required/>
                        <button class="btn btn-sm btn-outline-primary" type="submit">Add</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${results.content.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">No drugs found.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${results.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, results.totalPages - 1)}" th:classappend="${i == results.page} ? 'active'">
                <a class="page-link" th:href="@{/pharmacy/drugs(search=${search}, page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
