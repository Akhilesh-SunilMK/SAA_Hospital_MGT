<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add drug')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Add drug</h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/pharmacy/drugs/new}">
            <div class="row">
                <div class="col-md-4 mb-3"><label class="form-label">Code</label><input class="form-control" name="code" required/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Generic name</label><input class="form-control" name="genericName" required/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Brand name</label><input class="form-control" name="brandName"/></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label class="form-label">Form (e.g. Tablet)</label><input class="form-control" name="form" required/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Strength (e.g. 500mg)</label><input class="form-control" name="strength" required/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Manufacturer</label><input class="form-control" name="manufacturer"/></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Unit price</label><input type="number" step="0.01" class="form-control" name="unitPrice" required/></div>
                <div class="col-md-6 mb-3"><label class="form-label">Reorder level</label><input type="number" class="form-control" name="reorderLevel"/></div>
            </div>
            <button type="submit" class="btn btn-primary">Add drug</button>
            <a class="btn btn-link" th:href="@{/pharmacy/drugs}">Cancel</a>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
