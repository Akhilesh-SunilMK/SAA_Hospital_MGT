<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Low stock')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Drugs below reorder level</h2>
    <div class="card">
        <table class="table table-hover mb-0">
            <thead><tr><th>Code</th><th>Name</th><th>On hand</th><th>Reorder level</th></tr></thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.drugCode}"></td>
                <td th:text="${i.drugName}"></td>
                <td class="text-danger fw-bold" th:text="${i.totalQuantity}"></td>
                <td th:text="${i.reorderLevel}"></td>
            </tr>
            <tr th:if="${items.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">Everything is well stocked.</td></tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
