<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lab orders')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Lab orders</h2>
        <a th:if="${currentUser.doctor}" class="btn btn-primary" th:href="@{/lab/orders/new}"><i class="bi bi-plus-lg"></i> New order</a>
    </div>

    <form method="get" th:action="@{/lab/orders}" class="row g-2 mb-3">
        <div class="col-auto"><input type="number" class="form-control" name="id" placeholder="Order ID" required/></div>
        <div class="col-auto"><button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Look up</button></div>
    </form>

    <div th:if="${order != null}" class="card mb-3"><div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h5 class="card-title">Order #<span th:text="${order.id}"></span></h5>
                <span class="badge text-bg-info badge-status" th:text="${order.status}"></span>
                <span class="badge text-bg-warning badge-status" th:text="${order.priority}"></span>
                <span class="badge text-bg-secondary badge-status" th:if="${order.fastingRequired}">Fasting</span>
            </div>
        </div>
        <dl class="row mt-2">
            <dt class="col-3">Patient ID</dt><dd class="col-9" th:text="${order.patientId}"></dd>
            <dt class="col-3">Doctor ID</dt><dd class="col-9" th:text="${order.doctorId}"></dd>
            <dt class="col-3">Ordered at</dt><dd class="col-9" th:text="${order.orderedAt}"></dd>
        </dl>

        <table class="table table-sm">
            <thead><tr><th>Item ID</th><th>Test ID</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="i : ${order.items}">
                <td th:text="${i.id}"></td>
                <td th:text="${i.testId}"></td>
                <td th:text="${i.status}"></td>
            </tr>
            </tbody>
        </table>

        <div th:if="${currentUser.labTech}" class="row g-3">
            <div class="col-md-6">
                <h6>Update order status</h6>
                <form method="post" th:action="@{/lab/orders/{id}/status(id=${order.id})}" class="row g-2">
                    <div class="col-8">
                        <select class="form-select" name="status">
                            <option th:each="s : ${ {'ORDERED','COLLECTED','PROCESSING','COMPLETED','CANCELLED'} }" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>
                    <div class="col-4"><button class="btn btn-outline-primary w-100" type="submit">Update</button></div>
                </form>
            </div>
            <div class="col-md-6">
                <h6>Record result</h6>
                <form method="post" th:action="@{/lab/orders/{id}/results(id=${order.id})}" class="row g-2">
                    <div class="col-4"><input type="number" class="form-control" name="orderItemId" placeholder="Item ID" required/></div>
                    <div class="col-4"><input class="form-control" name="value" placeholder="Value" required/></div>
                    <div class="col-4"><input class="form-control" name="unit" placeholder="Unit"/></div>
                    <div class="col-6 mt-1"><input class="form-control" name="referenceRange" placeholder="Reference range"/></div>
                    <div class="col-4 mt-1 pt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="abnormalFlag" value="true" id="abnormal"/>
                            <label class="form-check-label" for="abnormal">Abnormal</label>
                        </div>
                    </div>
                    <div class="col-2 mt-1"><button class="btn btn-outline-primary w-100" type="submit">Save</button></div>
                </form>
            </div>
        </div>
    </div></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
