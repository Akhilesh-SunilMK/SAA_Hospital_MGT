<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order lab test')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Order lab test</h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/lab/orders/new}">
            <div class="mb-3">
                <label class="form-label">Patient ID</label>
                <input type="number" class="form-control" name="patientId" th:value="${patientId}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Tests</label>
                <select class="form-select" name="testIds" multiple size="8" required>
                    <option th:each="t : ${tests}" th:value="${t.id}" th:text="${t.code} + ' — ' + ${t.name}"></option>
                </select>
                <div class="form-text">Hold Ctrl/Cmd to select multiple tests.</div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" name="priority">
                        <option value="NORMAL">Normal</option>
                        <option value="STAT">STAT (urgent)</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3 pt-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="fastingRequired" value="true" id="fasting"/>
                        <label class="form-check-label" for="fasting">Fasting required</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Create order</button>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
