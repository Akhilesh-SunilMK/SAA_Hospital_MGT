<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notification preferences')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Notification preferences</h2>
    <div class="card"><div class="card-body">
        <p class="text-muted">Toggle each channel on or off for your account.</p>
        <div th:each="ch : ${ {'EMAIL','SMS','PUSH'} }" class="d-flex align-items-center justify-content-between border-bottom py-2">
            <span th:text="${ch}"></span>
            <div>
                <form method="post" th:action="@{/notifications/preferences}" class="d-inline">
                    <input type="hidden" name="channel" th:value="${ch}"/>
                    <input type="hidden" name="enabled" value="true"/>
                    <button class="btn btn-sm btn-outline-success" type="submit">Enable</button>
                </form>
                <form method="post" th:action="@{/notifications/preferences}" class="d-inline">
                    <input type="hidden" name="channel" th:value="${ch}"/>
                    <input type="hidden" name="enabled" value="false"/>
                    <button class="btn btn-sm btn-outline-secondary" type="submit">Disable</button>
                </form>
            </div>
        </div>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
