<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5 text-center">
    <i class="bi bi-exclamation-circle display-1 text-danger"></i>
    <h1 class="mt-3" th:text="${status} + ' &middot; ' + ${error}">Error</h1>
    <p class="text-muted" th:text="${message}"></p>
    <a class="btn btn-primary" href="/dashboard">Back to dashboard</a>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
