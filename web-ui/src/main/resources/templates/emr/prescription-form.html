<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New prescription')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Write prescription</h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/emr/prescriptions/new}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Patient ID</label>
                    <input type="number" class="form-control" name="patientId" th:value="${patientId}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">EMR record ID</label>
                    <input type="number" class="form-control" name="recordId" th:value="${recordId}" required/>
                    <div class="form-text">Create a medical record for this patient first — prescriptions must be linked to one.</div>
                </div>
            </div>

            <label class="form-label">Medications</label>
            <div id="rows">
                <div class="row g-2 mb-2 dyn-row">
                    <div class="col-md-3"><input class="form-control" name="drugName" placeholder="Drug name" required/></div>
                    <div class="col-md-2"><input class="form-control" name="dosage" placeholder="Dosage" required/></div>
                    <div class="col-md-2"><input class="form-control" name="frequency" placeholder="Frequency" required/></div>
                    <div class="col-md-2"><input type="number" class="form-control" name="durationDays" placeholder="Days" required/></div>
                    <div class="col-md-2"><input class="form-control" name="instructions" placeholder="Instructions"/></div>
                    <div class="col-md-1"><button type="button" class="btn btn-outline-danger" onclick="removeRow(this)">&times;</button></div>
                </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow('rows','row-template')">
                <i class="bi bi-plus-lg"></i> Add medication
            </button>
            <br/>
            <button type="submit" class="btn btn-primary">Issue prescription</button>
        </form>
    </div></div>

    <template id="row-template">
        <div class="row g-2 mb-2 dyn-row">
            <div class="col-md-3"><input class="form-control" name="drugName" placeholder="Drug name" required/></div>
            <div class="col-md-2"><input class="form-control" name="dosage" placeholder="Dosage" required/></div>
            <div class="col-md-2"><input class="form-control" name="frequency" placeholder="Frequency" required/></div>
            <div class="col-md-2"><input type="number" class="form-control" name="durationDays" placeholder="Days" required/></div>
            <div class="col-md-2"><input class="form-control" name="instructions" placeholder="Instructions"/></div>
            <div class="col-md-1"><button type="button" class="btn btn-outline-danger" onclick="removeRow(this)">&times;</button></div>
        </div>
    </template>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
