<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New EMR record')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">New medical record</h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/emr/records/new}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Patient ID</label>
                    <input type="number" class="form-control" name="patientId" th:value="${patientId}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Appointment ID (optional)</label>
                    <input type="number" class="form-control" name="appointmentId" th:value="${appointmentId}"/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Record type</label>
                <select class="form-select" name="recordType" required>
                    <option value="CONSULTATION">Consultation</option>
                    <option value="FOLLOW_UP">Follow-up</option>
                    <option value="EMERGENCY">Emergency</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Chief complaint</label>
                <input class="form-control" name="chiefComplaint"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="3"></textarea>
            </div>

            <label class="form-label">Diagnoses</label>
            <div id="rows">
                <div class="row g-2 mb-2 dyn-row">
                    <div class="col-md-3"><input class="form-control" name="icd10Code" placeholder="ICD-10 code"/></div>
                    <div class="col-md-5"><input class="form-control" name="diagnosisDescription" placeholder="Description"/></div>
                    <div class="col-md-3"><input class="form-control" name="diagnosisType" placeholder="Type (e.g. PRIMARY)"/></div>
                    <div class="col-md-1"><button type="button" class="btn btn-outline-danger" onclick="removeRow(this)">&times;</button></div>
                </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow('rows','row-template')">
                <i class="bi bi-plus-lg"></i> Add diagnosis
            </button>
            <br/>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="finalise" value="true" id="finalise"/>
                <label class="form-check-label" for="finalise">Finalise this record (locks it from further edits, only amendable afterward)</label>
            </div>

            <button type="submit" class="btn btn-primary">Save record</button>
        </form>
    </div></div>

    <template id="row-template">
        <div class="row g-2 mb-2 dyn-row">
            <div class="col-md-3"><input class="form-control" name="icd10Code" placeholder="ICD-10 code"/></div>
            <div class="col-md-5"><input class="form-control" name="diagnosisDescription" placeholder="Description"/></div>
            <div class="col-md-3"><input class="form-control" name="diagnosisType" placeholder="Type (e.g. PRIMARY)"/></div>
            <div class="col-md-1"><button type="button" class="btn btn-outline-danger" onclick="removeRow(this)">&times;</button></div>
        </div>
    </template>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
