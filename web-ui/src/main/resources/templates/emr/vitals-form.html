<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Record vitals')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Record vitals</h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/emr/vitals/new}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Patient ID</label>
                    <input type="number" class="form-control" name="patientId" th:value="${patientId}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">EMR record ID (optional)</label>
                    <input type="number" class="form-control" name="recordId"/>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 mb-3"><label class="form-label">BP systolic</label><input type="number" class="form-control" name="bpSystolic"/></div>
                <div class="col-md-3 mb-3"><label class="form-label">BP diastolic</label><input type="number" class="form-control" name="bpDiastolic"/></div>
                <div class="col-md-3 mb-3"><label class="form-label">Pulse</label><input type="number" class="form-control" name="pulse"/></div>
                <div class="col-md-3 mb-3"><label class="form-label">SpO2 (%)</label><input type="number" class="form-control" name="spo2"/></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label class="form-label">Temperature (&deg;C)</label><input type="number" step="0.1" class="form-control" name="temperature"/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Height (cm)</label><input type="number" step="0.1" class="form-control" name="heightCm"/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Weight (kg)</label><input type="number" step="0.1" class="form-control" name="weightKg"/></div>
            </div>
            <button type="submit" class="btn btn-primary">Save vitals</button>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
