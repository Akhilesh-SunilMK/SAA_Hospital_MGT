<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('EMR record #' + ${record.id})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h2 class="mb-0">Record #<span th:text="${record.id}"></span></h2>
            <span class="badge" th:classappend="${record.finalised} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${record.finalised} ? 'Finalised' : 'Draft'"></span>
            <span class="text-muted small ms-2" th:text="${record.createdAt}"></span>
        </div>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/emr/patients/{id}/history(id=${record.patientId})}">Patient history</a>
    </div>

    <div class="card mb-3"><div class="card-body">
        <dl class="row mb-0">
            <dt class="col-3">Patient ID</dt><dd class="col-9" th:text="${record.patientId}"></dd>
            <dt class="col-3">Record type</dt><dd class="col-9" th:text="${record.recordType}"></dd>
            <dt class="col-3">Chief complaint</dt><dd class="col-9" th:text="${record.chiefComplaint ?: '—'}"></dd>
            <dt class="col-3">Notes</dt><dd class="col-9" th:text="${record.notes ?: '—'}"></dd>
            <dt class="col-3">Diagnoses</dt>
            <dd class="col-9">
                <span th:if="${record.diagnoses.isEmpty()}">—</span>
                <span th:each="d : ${record.diagnoses}" class="badge text-bg-light border me-1" th:text="${d}"></span>
            </dd>
        </dl>
    </div></div>

    <div class="card" th:if="${currentUser.doctor}">
        <div class="card-body">
            <h5 class="card-title">Amend record</h5>
            <form method="post" th:action="@{/emr/records/{id}/amend(id=${record.id})}">
                <div class="mb-2"><textarea class="form-control" name="newValue" rows="2" placeholder="Amended value" required></textarea></div>
                <div class="mb-2"><input class="form-control" name="reason" placeholder="Reason for amendment" required/></div>
                <button class="btn btn-outline-secondary btn-sm" type="submit">Submit amendment</button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
