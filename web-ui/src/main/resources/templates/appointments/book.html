<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book appointment')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Book appointment</h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/appointments/book}">
            <div class="mb-3" th:if="${!currentUser.patient}">
                <label class="form-label">Patient ID</label>
                <input type="number" class="form-control" name="patientId" th:value="${patientId}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Doctor</label>
                <select class="form-select" name="doctorId" required>
                    <option value="">Select a doctor</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="'Dr. ' + ${d.firstName} + ' ' + ${d.lastName} + ' — ' + ${d.specialisation}"
                            th:selected="${d.id == doctorId}"></option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date &amp; time</label>
                    <input type="datetime-local" class="form-control" name="slot" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Type</label>
                    <select class="form-select" name="type" required>
                        <option value="OPD">OPD</option>
                        <option value="FOLLOW_UP">Follow-up</option>
                        <option value="EMERGENCY">Emergency</option>
                        <option value="TELE">Telemedicine</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Duration (minutes)</label>
                <input type="number" class="form-control" name="durationMinutes" value="15" min="5"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Reason for visit</label>
                <textarea class="form-control" name="reason" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Book</button>
            <a class="btn btn-link" th:href="@{/appointments}">Cancel</a>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
