<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add doctor')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Add doctor</h2>
    <p class="text-muted">The doctor must already have a user account (role DOCTOR) &mdash; enter their user ID below.</p>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/doctors/new}">
            <div class="mb-3"><label class="form-label">User ID</label><input type="number" class="form-control" name="userId" required/></div>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">First name</label><input class="form-control" name="firstName" required/></div>
                <div class="col-md-6 mb-3"><label class="form-label">Last name</label><input class="form-control" name="lastName" required/></div>
            </div>
            <div class="mb-3"><label class="form-label">Registration No.</label><input class="form-control" name="registrationNo" required/></div>
            <div class="mb-3"><label class="form-label">Qualification</label><input class="form-control" name="qualification" required/></div>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Specialisation</label><input class="form-control" name="specialisation" required/></div>
                <div class="col-md-6 mb-3"><label class="form-label">Department</label><input class="form-control" name="department" required/></div>
            </div>
            <div class="mb-3"><label class="form-label">Consultation fee</label><input type="number" step="0.01" class="form-control" name="consultationFee" required/></div>
            <button type="submit" class="btn btn-primary">Create</button>
            <a class="btn btn-link" th:href="@{/doctors}">Cancel</a>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
