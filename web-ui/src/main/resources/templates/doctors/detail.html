<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dr. ' + ${doctor.lastName})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h2 class="mb-0" th:text="'Dr. ' + ${doctor.firstName} + ' ' + ${doctor.lastName}"></h2>
            <span class="badge text-bg-info" th:text="${doctor.specialisation}"></span>
            <span class="text-muted ms-2" th:text="${doctor.department}"></span>
        </div>
        <div>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/appointments/book(doctorId=${doctor.id})}">Book appointment</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/appointments/queue(doctorId=${doctor.id})}">Queue</a>
            <a th:if="${currentUser.doctor or currentUser.admin}" class="btn btn-outline-secondary btn-sm" th:href="@{/doctors/{id}/schedule(id=${doctor.id})}">Manage schedule</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title">Profile</h5>
                <dl class="row mb-0">
                    <dt class="col-5">Registration No.</dt><dd class="col-7" th:text="${doctor.registrationNo}"></dd>
                    <dt class="col-5">Qualification</dt><dd class="col-7" th:text="${doctor.qualification}"></dd>
                    <dt class="col-5">Consultation fee</dt><dd class="col-7" th:text="${doctor.consultationFee}"></dd>
                </dl>
            </div></div>
        </div>

        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title">Check availability</h5>
                <form method="get" th:action="@{/doctors/{id}(id=${doctor.id})}" class="row g-2 mb-3">
                    <div class="col-8"><input type="date" class="form-control" name="date" th:value="${date}" required/></div>
                    <div class="col-4"><button class="btn btn-outline-primary w-100" type="submit">Check</button></div>
                </form>
                <div th:if="${availability != null}">
                    <p th:if="${availability.onLeave}" class="text-danger">On leave this day.</p>
                    <div th:unless="${availability.onLeave}">
                        <p th:if="${availability.availableSlots.isEmpty()}" class="text-muted">No open slots.</p>
                        <span th:each="s : ${availability.availableSlots}" class="badge text-bg-light border me-1 mb-1" th:text="${s}"></span>
                    </div>
                </div>
            </div></div>
        </div>
    </div>

    <div class="card mt-3" th:if="${currentUser.doctor or currentUser.admin}">
        <div class="card-body">
            <h5 class="card-title">Add leave</h5>
            <form method="post" th:action="@{/doctors/{id}/leave(id=${doctor.id})}" class="row g-2">
                <div class="col-md-3"><input type="date" class="form-control" name="fromDate" required/></div>
                <div class="col-md-3"><input type="date" class="form-control" name="toDate" required/></div>
                <div class="col-md-4"><input class="form-control" name="reason" placeholder="Reason (optional)"/></div>
                <div class="col-md-2"><button class="btn btn-outline-secondary w-100" type="submit">Add leave</button></div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
