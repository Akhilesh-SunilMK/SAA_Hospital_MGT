<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Doctors')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Doctors</h2>
        <a th:if="${currentUser.admin}" class="btn btn-primary" th:href="@{/doctors/new}"><i class="bi bi-person-plus"></i> Add doctor</a>
    </div>

    <form method="get" th:action="@{/doctors}" class="row g-2 mb-3">
        <div class="col-auto"><input class="form-control" name="specialisation" th:value="${specialisation}" placeholder="Specialisation"/></div>
        <div class="col-auto"><input class="form-control" name="department" th:value="${department}" placeholder="Department"/></div>
        <div class="col-auto"><button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Filter</button></div>
    </form>

    <div class="row g-3">
        <div class="col-md-4" th:each="d : ${results}">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title" th:text="'Dr. ' + ${d.firstName} + ' ' + ${d.lastName}"></h5>
                <p class="card-text mb-1"><span class="badge text-bg-info" th:text="${d.specialisation}"></span></p>
                <p class="card-text text-muted small" th:text="${d.department}"></p>
                <p class="card-text small">Fee: <span th:text="${d.consultationFee}"></span></p>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/doctors/{id}(id=${d.id})}">View</a>
            </div></div>
        </div>
        <div class="col-12" th:if="${results.isEmpty()}"><p class="text-muted">No doctors found.</p></div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
