<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit patient')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Edit <span th:text="${patient.firstName + ' ' + patient.lastName}"></span></h2>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/patients/{id}/edit(id=${patient.id})}">
            <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone" th:value="${patient.phone}" required/></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" th:value="${patient.email}"/></div>
            <div class="mb-3"><label class="form-label">Address</label><input class="form-control" name="address" th:value="${patient.address}"/></div>
            <div class="mb-3">
                <label class="form-label">Blood group</label>
                <select class="form-select" name="bloodGroup">
                    <option value=""></option>
                    <option th:each="bg : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }" th:value="${bg}" th:text="${bg}" th:selected="${bg == patient.bloodGroup}"></option>
                </select>
            </div>
            <div class="mb-3"><label class="form-label">Allergies summary</label><input class="form-control" name="allergiesSummary" th:value="${patient.allergiesSummary}"/></div>
            <div class="mb-3"><label class="form-label">Chronic conditions</label><input class="form-control" name="chronicConditions" th:value="${patient.chronicConditions}"/></div>
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-link" th:href="@{/patients/{id}(id=${patient.id})}">Cancel</a>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
