<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register patient')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-3">Register new patient</h2>
    <p class="text-muted">Creates a login account for the patient plus their patient/demographics record.</p>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/patients/new}">
            <h5 class="mb-3">Account</h5>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required/></div>
                <div class="col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required/></div>
            </div>
            <div class="mb-3"><label class="form-label">Temporary password</label><input type="password" class="form-control" name="password" required minlength="8"/></div>

            <h5 class="mb-3 mt-4">Demographics</h5>
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">First name</label><input class="form-control" name="firstName" required/></div>
                <div class="col-md-6 mb-3"><label class="form-label">Last name</label><input class="form-control" name="lastName" required/></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label class="form-label">Date of birth</label><input type="date" class="form-control" name="dob" required/></div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender" required>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone" required/></div>
            </div>
            <div class="mb-3"><label class="form-label">Address</label><input class="form-control" name="address"/></div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Blood group</label>
                    <select class="form-select" name="bloodGroup">
                        <option value=""></option>
                        <option th:each="bg : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }" th:value="${bg}" th:text="${bg}"></option>
                    </select>
                </div>
                <div class="col-md-4 mb-3"><label class="form-label">Allergies summary</label><input class="form-control" name="allergiesSummary"/></div>
                <div class="col-md-4 mb-3"><label class="form-label">Chronic conditions</label><input class="form-control" name="chronicConditions"/></div>
            </div>
            <button type="submit" class="btn btn-primary">Register patient</button>
            <a class="btn btn-link" th:href="@{/patients}">Cancel</a>
        </form>
    </div></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
