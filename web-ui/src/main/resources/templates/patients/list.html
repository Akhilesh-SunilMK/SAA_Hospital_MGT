<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Patients')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Patients</h2>
        <a th:if="${currentUser.receptionist or currentUser.admin}" class="btn btn-primary" th:href="@{/patients/new}">
            <i class="bi bi-person-plus"></i> Register new patient
        </a>
    </div>

    <form method="get" th:action="@{/patients}" class="row g-2 mb-3">
        <div class="col-auto flex-grow-1">
            <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search by name or MRN"/>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Search</button>
        </div>
    </form>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead><tr><th>MRN</th><th>Name</th><th>DOB</th><th>Gender</th><th>Phone</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${results.content}">
                <td th:text="${p.mrn}"></td>
                <td th:text="${p.firstName + ' ' + p.lastName}"></td>
                <td th:text="${p.dob}"></td>
                <td th:text="${p.gender}"></td>
                <td th:text="${p.phone}"></td>
                <td class="table-actions">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/patients/{id}(id=${p.id})}">View</a>
                </td>
            </tr>
            <tr th:if="${results.content.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">No patients found.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${results.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, results.totalPages - 1)}"
                th:classappend="${i == results.page} ? 'active'">
                <a class="page-link" th:href="@{/patients(search=${search}, page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
