<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Invoice ' + ${invoice.invoiceNo})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <h2 class="mb-1">Invoice <span th:text="${invoice.invoiceNo}"></span></h2>
    <span class="badge text-bg-info badge-status" th:text="${invoice.status}"></span>

    <div class="row g-3 mt-1">
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title">Summary</h5>
                <dl class="row mb-0">
                    <dt class="col-6">Patient ID</dt><dd class="col-6" th:text="${invoice.patientId}"></dd>
                    <dt class="col-6">Appointment</dt><dd class="col-6" th:text="${invoice.appointmentId ?: '—'}"></dd>
                    <dt class="col-6">Subtotal</dt><dd class="col-6" th:text="${invoice.subtotal}"></dd>
                    <dt class="col-6">Tax</dt><dd class="col-6" th:text="${invoice.tax}"></dd>
                    <dt class="col-6">Discount</dt><dd class="col-6" th:text="${invoice.discount}"></dd>
                    <dt class="col-6 fw-bold">Total</dt><dd class="col-6 fw-bold" th:text="${invoice.total}"></dd>
                    <dt class="col-6 fw-bold">Balance due</dt><dd class="col-6 fw-bold text-danger" th:text="${invoice.balance}"></dd>
                </dl>
            </div></div>
        </div>

        <div class="col-md-6" th:if="${currentUser.accountant or currentUser.receptionist}">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title">Record payment</h5>
                <form method="post" th:action="@{/billing/payments/new}">
                    <input type="hidden" name="invoiceId" th:value="${invoice.id}"/>
                    <div class="row g-2">
                        <div class="col-6">
                            <select class="form-select" name="method" required>
                                <option value="CASH">Cash</option><option value="CARD">Card</option><option value="UPI">UPI</option>
                                <option value="NET_BANKING">Net banking</option><option value="INSURANCE">Insurance</option>
                            </select>
                        </div>
                        <div class="col-6"><input type="number" step="0.01" class="form-control" name="amount" placeholder="Amount" required/></div>
                        <div class="col-12 mt-1"><input class="form-control" name="reference" placeholder="Reference (optional)"/></div>
                    </div>
                    <button class="btn btn-primary btn-sm mt-2" type="submit">Record payment</button>
                </form>
            </div></div>
        </div>

        <div class="col-md-6" th:if="${currentUser.accountant or currentUser.admin}">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title">Issue refund</h5>
                <form method="post" th:action="@{/billing/refunds/new}">
                    <input type="hidden" name="invoiceId" th:value="${invoice.id}"/>
                    <div class="row g-2">
                        <div class="col-6"><input type="number" class="form-control" name="paymentId" placeholder="Payment ID" required/></div>
                        <div class="col-6"><input type="number" step="0.01" class="form-control" name="amount" placeholder="Amount" required/></div>
                        <div class="col-12 mt-1"><input class="form-control" name="reason" placeholder="Reason" required/></div>
                    </div>
                    <button class="btn btn-outline-danger btn-sm mt-2" type="submit">Issue refund</button>
                </form>
            </div></div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
