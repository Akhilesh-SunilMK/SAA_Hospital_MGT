<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Invoices')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Invoices</h2>
        <a th:if="${currentUser.accountant or currentUser.receptionist or currentUser.admin}" class="btn btn-primary" th:href="@{/billing/invoices/new}">
            <i class="bi bi-plus-lg"></i> Create invoice
        </a>
    </div>

    <form method="get" th:action="@{/billing/invoices}" class="row g-2 mb-3" th:if="${currentUser.accountant or currentUser.admin}">
        <div class="col-auto"><input type="number" class="form-control" name="patientId" th:value="${patientId}" placeholder="Patient ID"/></div>
        <div class="col-auto">
            <select class="form-select" name="status">
                <option value="">Any status</option>
                <option th:each="s : ${ {'DRAFT','ISSUED','PARTIALLY_PAID','PAID','CANCELLED','REFUNDED'} }" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Filter</button></div>
    </form>

    <div class="card">
        <table class="table table-hover mb-0">
            <thead><tr><th>Invoice #</th><th>Patient</th><th>Total</th><th>Balance</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="i : ${results.content}">
                <td th:text="${i.invoiceNo}"></td>
                <td th:text="${i.patientId}"></td>
                <td th:text="${i.total}"></td>
                <td th:text="${i.balance}"></td>
                <td><span class="badge text-bg-info badge-status" th:text="${i.status}"></span></td>
                <td class="table-actions"><a class="btn btn-sm btn-outline-primary" th:href="@{/billing/invoices/{id}(id=${i.id})}">View</a></td>
            </tr>
            <tr th:if="${results.content.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">No invoices found.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${results.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, results.totalPages - 1)}" th:classappend="${i == results.page} ? 'active'">
                <a class="page-link" th:href="@{/billing/invoices(patientId=${patientId}, status=${status}, page=${i})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
