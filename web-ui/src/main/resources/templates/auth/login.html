<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h3 class="card-title mb-1"><i class="bi bi-hospital text-primary"></i> Hospital Management System</h3>
            <p class="text-muted mb-4">Sign in to continue</p>
            <form method="post" th:action="@{/login}">
                <input type="hidden" name="next" th:value="${next}"/>
                <div class="mb-3">
                    <label class="form-label">Username or email</label>
                    <input type="text" class="form-control" name="usernameOrEmail" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
            <p class="text-center mt-3 mb-0">
                <a th:href="@{/register}">Create an account</a>
            </p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
