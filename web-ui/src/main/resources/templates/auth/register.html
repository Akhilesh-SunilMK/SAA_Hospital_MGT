<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="card auth-card" style="max-width: 520px;">
        <div class="card-body p-4">
            <h3 class="card-title mb-1"><i class="bi bi-person-plus text-primary"></i> Create account</h3>
            <p class="text-muted mb-4">
                Patients can self-register below. Staff accounts (doctor, nurse, receptionist, lab tech,
                pharmacist, accountant, admin) are also created here for this demo &mdash; pick the role you need.
            </p>
            <form method="post" th:action="@{/register}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First name</label>
                        <input type="text" class="form-control" name="firstName" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last name</label>
                        <input type="text" class="form-control" name="lastName" required/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required minlength="8"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" name="role" required>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r.name() == 'PATIENT'}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create account</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Already have an account? <a th:href="@{/login}">Log in</a>
            </p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
