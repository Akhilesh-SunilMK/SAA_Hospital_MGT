<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5 text-center">

    <h1 class="mt-3">500 &middot; Something went wrong</h1>

<div th:replace="~{fragments/layout :: scripts}"></div>

</html>
